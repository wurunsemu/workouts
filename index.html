<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workouts</title>
<meta name="theme-color" content="#ff6a2b">
<meta name="description" content="Antrenman yükü, ağırlık ve vücut kompozisyonu takibi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f3f4f8;--card:#fff;--tx:#12151c;--mut:#6b7280;--ac:#ff6a2b;--ac2:#3b82f6;--bd:#e8eaf0;--ok:#16a34a;--warn:#dc2626;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#181c25;--tx:#eef1f6;--mut:#98a2b3;--ac:#ff8247;--ac2:#60a5fa;--bd:#262c3a;--ok:#4ade80;--sh:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
.hero{margin:0 -14px 14px;padding:calc(env(safe-area-inset-top,0px) + 22px) 22px 26px;background:linear-gradient(135deg,#ff6a2b,#ff3d6e 60%,#a855f7);color:#fff;border-radius:0 0 26px 26px}
.hero h1{margin:0;font-size:28px;letter-spacing:-.6px}.hero #sy{font-size:12px;opacity:.92;margin-top:2px}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.2px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bd)}
details.card summary{cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:var(--sh);border:1px solid var(--bd)}
.stat b{display:block;font-size:25px;letter-spacing:-.6px;line-height:1.25}.stat span{color:var(--mut);font-size:12px}
em{font-style:normal;font-size:12px;font-weight:600;margin-left:6px}em.up{color:var(--ok)}em.dn{color:var(--ac2)}
nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:740px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:22px;display:flex;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.16);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:7px 2px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button i{font-style:normal;font-size:19px;line-height:1.2}
nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,transparent)}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input[type=range]{padding:0;accent-color:var(--ac)}
.row{display:grid;gap:8px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r4{grid-template-columns:2.2fr 1fr 1fr 1fr}
.sh{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:4px}
.btn{background:linear-gradient(135deg,#ff6a2b,#ff3d6e);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:14px}
.btn.s{background:var(--bd);color:var(--tx);width:auto;margin:8px 6px 0 0;padding:9px 14px;font-weight:600;border-radius:12px}
button.x{width:30px;height:30px;padding:0;border-radius:50%;background:var(--bd);border:none;cursor:pointer;font-size:13px;color:var(--mut);flex-shrink:0;line-height:1}
button.x:active{background:var(--bd2,#d1d5db);color:#ef4444}
.x{background:none;border:0;color:var(--warn);cursor:pointer;font-size:16px;padding:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}.item small{color:var(--mut);display:block}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;margin-right:6px}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}
svg{width:100%;height:auto;display:block}.hide{display:none}textarea{min-height:70px;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;padding:10px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--cc,var(--ac));border-color:var(--cc,var(--ac));color:#fff}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);margin:6px 12px 0 0}.lg i{width:9px;height:9px;border-radius:3px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(12,1fr);gap:4px}.heat i{aspect-ratio:1;border-radius:5px;background:var(--bd)}
.sh2{display:grid;grid-template-columns:105px 1fr 38px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.sh2 div{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.sh2 i{display:block;height:100%;border-radius:9px}.sh2 b{text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--bd);border-left:4px solid var(--cc);background:var(--bg);color:var(--tx);border-radius:12px;padding:9px 10px;text-align:left;font:inherit;cursor:pointer}
.tile.on{background:color-mix(in srgb,var(--cc) 14%,var(--card))}.tile span{display:block;font-size:11px;color:var(--mut)}.tile b{font-size:18px}.tile small{font-size:11px;color:var(--mut);margin-left:2px}.tile em{display:block;margin:0}
.drop{display:block;text-align:center;border:2px dashed var(--bd);border-radius:16px;padding:18px;margin:0;font-size:15px;color:var(--tx);cursor:pointer}.drop small{display:block;font-weight:400;color:var(--mut)}
.hero #gr{margin-top:8px;font-size:18px;font-weight:700}.hero #gr small{display:block;font-size:13px;font-weight:400;opacity:.92}.hero #sy{margin-top:8px}
.wl{position:fixed;inset:0;z-index:30;background:linear-gradient(135deg,#ff6a2b,#ff3d6e 60%,#a855f7);display:flex;align-items:center;justify-content:center;padding:20px}.wl.hide{display:none}
.wc{background:var(--card);border-radius:24px;padding:28px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}.wc h2{font-size:22px;margin:8px 0}.wc input{text-align:center;margin-top:14px;font-size:17px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}.mo.hide{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.item.pk:active{background:var(--bg)}
/* rest timer */
#rtimer{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+82px);left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--ac);border-radius:22px;padding:14px 20px;box-shadow:0 8px 32px rgba(0,0,0,.22);z-index:22;text-align:center;min-width:210px}
#rtimer.hide{display:none!important}
.rt-lbl{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:3px}
.rt-num{font-size:46px;font-weight:800;letter-spacing:-2px;color:var(--ac);line-height:1.1}
.rt-done{color:var(--ok)}
.rt-dur{display:flex;gap:6px;margin-top:8px;justify-content:center}
.rt-dur button{border:1px solid var(--bd);background:var(--bg);color:var(--mut);border-radius:10px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.rt-dur button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rt-ctrl{display:flex;gap:8px;margin-top:9px}
.rt-ctrl button{flex:1;padding:8px 10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
/* plate calc */
.plates{font-size:11px;color:var(--mut);margin:3px 0 2px;display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:16px}
.plq{display:inline-block;padding:1px 6px;border-radius:6px;font-weight:700;font-size:11px}
/* progression */
.prog{font-weight:700;font-size:12px;color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><h1 id="ttl">Workouts</h1><div id="gr"></div><div id="sy">Yerel kayıt</div></header>
<section id="v-ozet"></section>
<section id="v-kayit" class="hide"></section>
<section id="v-plan" class="hide"><div class="chips" id="pt"></div><div id="pm"></div><div id="po" class="hide"></div></section>
<section id="v-gelisim" class="hide"></section>
<section id="v-vucut" class="hide"></section>
</div>
<div id="wl" class="wl hide"><div class="wc" id="wc"><div style="font-size:54px">🏋️</div><h2>Workouts’e hoş geldin!</h2><p class="note" style="margin:0">Seni daha iyi tanıyalım. Sana nasıl hitap etmemizi istersin?</p><input id="wn" placeholder="Adın veya takma adın" maxlength="30" autocomplete="given-name"><button class="btn" id="wb">Başla</button></div></div>
<div id="md" class="mo hide"></div><div id="md2" class="mo hide" style="z-index:50"></div>
<nav id="nav"></nav>
<div id="rtimer" class="hide">
 <div class="rt-lbl">⏱️ Dinlenme süresi</div>
 <div class="rt-num" id="rtn">1:30</div>
 <div class="rt-dur" id="rtd">
  <button data-rs="60">60s</button>
  <button data-rs="90" class="on">90s</button>
  <button data-rs="120">120s</button>
  <button data-rs="180">180s</button>
 </div>
 <div class="rt-ctrl">
  <button id="rtsk">Geç ⏭</button>
  <button id="rtrs">Yeniden ▶</button>
 </div>
</div>
<script src="library.js"></script>
<script>
const KEY='antrenman-takip-v1';
const DEFAULT_URL='';let SCRIPT_URL;try{SCRIPT_URL=localStorage.getItem('workouts-url')}catch(e){}if(SCRIPT_URL===null||SCRIPT_URL===undefined)SCRIPT_URL=DEFAULT_URL;
const T={fitness:['Fitness','🏋️','#ff6a2b'],swim:['Yüzme','🏊','#3b82f6'],tennis:['Tenis','🎾','#10b981'],run:['Koşu','🏃','#a855f7'],ell:['Eliptik','🚴','#f59e0b']};
const EX=('Squat|Front squat|Goblet squat|Bulgarian split squat|Hack squat|Lunge|Walking lunge|Step-up|Leg press|Leg extension|Leg curl (yatarak)|Leg curl (oturarak)|Romanian deadlift|Stiff-leg deadlift|Good morning|Hip thrust|Glute bridge|Kettlebell swing|Calf raise (ayakta)|Calf raise (oturarak)|Abductor makine|Adductor makine|'+
'Bench press|Incline bench press|Decline bench press|Close-grip bench press|Dumbbell bench press|Incline dumbbell press|Dumbbell fly|Cable fly|Pec deck|Chest press makine|Push-up|Dips|'+
'Overhead press|Dumbbell shoulder press|Arnold press|Push press|Lateral raise|Front raise|Rear delt fly|Face pull|Upright row|Triceps pushdown|Skull crusher|Overhead triceps extension|Triceps kickback|'+
'Deadlift|Sumo deadlift|Barbell row|Dumbbell row|T-bar row|Seated cable row|Lat pulldown|Close-grip pulldown|Pull-up|Chin-up|Straight-arm pulldown|Shrug|Hyperextension|'+
'Barbell curl|Dumbbell curl|Hammer curl|Preacher curl|Cable curl|Concentration curl|Wrist curl|'+
'Plank|Crunch|Cable crunch|Hanging leg raise|Russian twist|Ab wheel|Pallof press|Farmer walk|Medicine ball throw|Clean|Snatch|Thruster|Rotator cuff external rotation').split('|');
let S={sessions:[],weights:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S.sessions)S.sessions=[];if(!S.weights)S.weights=[];if(!S.plans)S.plans=[];
let pt,ready=!SCRIPT_URL;
const sy=t=>{const e=$('sy');if(e)e.textContent=t};
const time=()=>new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};
function push(){if(!SCRIPT_URL||!ready)return;clearTimeout(pt);pt=setTimeout(async()=>{try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(S)});sy('☁️ Sheets’e kaydedildi · '+time())}catch(e){sy('⚠️ Senkron hatası, yerel kayıt var')}},1200)}
function merge(R){const del=new Set([...(S.del||[]),...(R.del||[])]),m=new Map(),w=new Map(),p=new Map();
 [...(R.sessions||[]),...S.sessions].forEach(s=>{if(!del.has('s:'+s.id))m.set(s.id,s)});
 [...(R.weights||[]),...S.weights].forEach(a=>{if(!del.has('w:'+a.date))w.set(a.date,a)});
 [...(R.plans||[]),...(S.plans||[])].forEach(x=>{if(del.has('p:'+x.id))return;const o=p.get(x.id);if(!o||(x.u||0)>=(o.u||0))p.set(x.id,x)});
 S={sessions:[...m.values()],weights:[...w.values()],plans:[...p.values()],del:[...del],name:S.name||R.name||'',ap:(R.ap&&(R.ap.u||0)>((S.ap||{}).u||0))?R.ap:S.ap}}
async function pull(){if(!SCRIPT_URL){sy('Yerel kayıt (script linki tanımlı değil)');return}
 sy('Senkronize ediliyor…');
 try{const d=await (await fetch(SCRIPT_URL)).json();if(d&&(d.sessions||d.weights||d.plans))merge(d);ready=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push();render();sy('☁️ Senkronize · '+time())}
 catch(e){sy('⚠️ Sheets’e ulaşılamadı, yerel kayıt kullanılıyor')}}
const initSync=()=>{Promise.race([pull(),new Promise(r=>setTimeout(r,4000))]).then(welcome);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SCRIPT_URL)pull()})};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const pd=s=>new Date(s+'T00:00');
const wk=s=>{const x=pd(s);x.setDate(x.getDate()-((x.getDay()+6)%7));return fmt(x)};
const dm=s=>{const x=pd(s);return x.getDate()+'.'+pad(x.getMonth()+1)};
const nf=n=>Math.round(n).toLocaleString('tr-TR');
const load=s=>(s.dur||0)*(s.rpe||0);
const tonnage=s=>(s.sets||[]).reduce((a,x)=>a+x.n*x.r*x.kg,0);
const e1rm=(kg,r)=>r<=1?kg:kg*(1+r/30);

/* plate calculator */
const PSIZES=[25,20,15,10,5,2.5,1.25];
const PCOLORS=['#ef4444','#3b82f6','#f59e0b','#10b981','#e5e7eb','#d1d5db','#9ca3af'];
const PTXT=['#fff','#fff','#111','#fff','#333','#333','#333'];
function calcPlates(totalKg,bar){bar=bar||20;let rem=(totalKg-bar)/2;if(rem<0)return'Bar ağırlığından düşük';if(rem===0)return'<span style="color:var(--mut)">Yalnız bar ('+bar+' kg)</span>';const p=[];PSIZES.forEach((w,i)=>{const c=Math.floor(rem/w+.001);if(c>0){p.push(`<span class="plq" style="background:${PCOLORS[i]};color:${PTXT[i]}">${c}×${w}</span>`);rem=Math.round((rem-c*w)*1000)/1000}});return(p.length?p.join('')+'<span style="margin-left:3px;color:var(--mut)">/ taraf</span>':'<span style="color:var(--mut)">Plak yok</span>')}
function isBarbell(n){if(!n)return false;try{const b=libFind(n);return b&&[0,6,7,8,9].includes(b.eq)}catch(e){return false}}

/* rest timer */
let rtSec=90,rtInt=null,rtWL=null;
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();o.type='sine';o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();setTimeout(()=>c.close(),100)},280)}catch(e){}}
function rtUpdate(s){const el=$('rtn');if(!el)return;const m=Math.floor(s/60),ss=s%60;el.textContent=m+':'+(ss<10?'0':'')+ss;el.className='rt-num'+(s<=0?' rt-done':'')}
function stopRest(){clearInterval(rtInt);rtInt=null;if(rtWL){rtWL.release().catch(()=>{});rtWL=null}const el=$('rtimer');if(el)el.classList.add('hide')}
function startRest(sec){
 if(!$('rtimer'))return;
 $('rtimer').classList.remove('hide');
 let s=sec||rtSec;rtUpdate(s);
 clearInterval(rtInt);
 rtInt=setInterval(()=>{s--;rtUpdate(s);if(s<=0){clearInterval(rtInt);rtInt=null;beep()}},1000);
 if('wakeLock' in navigator)navigator.wakeLock.request('screen').then(w=>{rtWL=w}).catch(()=>{});
 $('rtsk').onclick=stopRest;
 $('rtrs').onclick=()=>startRest(rtSec);
 $('rtd').querySelectorAll('[data-rs]').forEach(b=>{b.classList.toggle('on',+b.dataset.rs===rtSec);b.onclick=()=>{rtSec=+b.dataset.rs;$('rtd').querySelectorAll('[data-rs]').forEach(x=>x.classList.toggle('on',+x.dataset.rs===rtSec));startRest(rtSec)}});
}

/* draft + workout timer */
const DK='w-draft';
let wkStart=null,wkTick=null;
function saveDraft(){if(cur!=='fitness')return;try{localStorage.setItem(DK,JSON.stringify({sets,date:$('fd')?.value||today(),rpe:$('frpe')?.value||'13',note:$('fnote')?.value||'',ts:wkStart}))}catch(e){}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(DK)||'null');return(d&&d.sets&&d.sets.length)?d:null}catch(e){return null}}
function clearDraft(){try{localStorage.removeItem(DK)}catch(e){}}
function wkTock(){if(!wkStart)return;const s=Math.floor((Date.now()-wkStart)/1000);const el=$('wkt');if(el)el.textContent='⏱ '+Math.floor(s/60)+':'+(String(s%60).padStart(2,'0'));const dur=$('fdur');if(dur&&!dur._m){dur.value=Math.max(1,Math.ceil(s/60));if($('frpe')){const r=+$('frpe').value,d=parseFloat(dur.value)||0;$('lp').innerHTML=d?`Hesaplanan yük: <b>${nf(d*r)} AU</b> (${d} dk × ${r})`:''}}}
function startWkTimer(){if(!wkStart)wkStart=Date.now();clearInterval(wkTick);wkTick=setInterval(wkTock,5000);wkTock()}
function stopWkTimer(){clearInterval(wkTick);wkTick=null}

let tab='ozet',cur='fitness',gsel=null,sets=[{ex:'',n:3,r:8,kg:0}],pend=null,pre=null,ptab='mine';

function setTab(t){tab=t;['ozet','kayit','plan','gelisim','vucut'].forEach(k=>$('v-'+k).classList.toggle('hide',k!==t));render()}
function nav(){const L=[['ozet','🏠','Özet'],['kayit','＋','Kayıt'],['plan','📋','Planlar'],['gelisim','📈','Gelişim'],['vucut','🧍','Vücut']];
 $('nav').innerHTML=L.map(([k,i,n])=>`<button class="${k===tab?'on':''}" data-t="${k}"><i>${i}</i>${n}</button>`).join('');
 $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.t))}

/* grafikler */
function line(pts,unit,color){
 if(pts.length<2)return '<p class="note">Grafik için en az 2 kayıt gerekli.</p>';
 const W=340,H=170,l=34,r=12,t=14,b=24,ys=pts.map(a=>a.y);let mn=Math.min(...ys),mx=Math.max(...ys);const pp=(mx-mn)*.15||1;mn-=pp;mx+=pp;
 const X=i=>l+i*(W-l-r)/(pts.length-1),Y=v=>t+(1-(v-mn)/(mx-mn))*(H-t-b),g='g'+Math.random().toString(36).slice(2,7);
 const d=pts.map((a,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(a.y).toFixed(1)).join(' ');
 const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f,y=Y(v);return `<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${l-5}" y="${y+3}" font-size="9" text-anchor="end" fill="var(--mut)">${v.toFixed(v<30?1:0)}</text>`}).join('');
 return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.3"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs>${grid}<path d="${d} L${X(pts.length-1)} ${H-b} L${X(0)} ${H-b}Z" fill="url(#${g})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`+
 pts.map((a,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(a.y).toFixed(1)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?color:'var(--card)'}" stroke="${color}" stroke-width="2"><title>${dm(a.x)}: ${a.y.toFixed(1)} ${unit}</title></circle>`).join('')+

  return Object.entries(x.by).map(([k,v])=>{const hh=v/mx*(h-46);y-=hh;return `<rect x="${X}" y="${y}" width="${bw-10}" height="${Math.max(hh,1)}" rx="3" fill="${T[k][2]}"><title>${T[k][0]}: ${nf(v)} AU</title></rect>`}).join('')+
  (x.load?`<text x="${cx}" y="${y-4}" font-size="9" text-anchor="middle" fill="var(--tx)">${nf(x.load)}</text>`:'')+`<text x="${cx}" y="${h-8}" font-size="9" text-anchor="middle" fill="var(--mut)">${dm(x.w)}</text>`}).join('')+'</svg>'}
function heat(){const b=new Date();b.setHours(0,0,0,0);b.setDate(b.getDate()-((b.getDay()+6)%7)-77);const L={},td=today();S.sessions.forEach(s=>L[s.date]=(L[s.date]||0)+load(s));const mx=Math.max(...Object.values(L),1);let h='';
 for(let i=0;i<84;i++){const d=new Date(b);d.setDate(b.getDate()+i);const k=fmt(d),v=L[k]||0;
  h+=k>td?'<i style="opacity:0"></i>':`<i title="${dm(k)}${v?': '+nf(v)+' AU':''}"${v?` style="background:color-mix(in srgb,var(--ac) ${Math.round(25+v/mx*75)}%,var(--bd))"`:''}></i>`}

function exNames(){const m=new Set();S.sessions.forEach(s=>(s.sets||[]).forEach(x=>m.add(x.ex)));return[...m]}

  if(l.kg>0){const sug=Math.round((l.kg+2.5)*4)/4;h+=` <span class="prog">📈 ${sug} kg?</span>`}}
 if(b)h+=(h?' · ':'')+`<a href="#" data-nf="${b.id}">ⓘ tarif</a>`;
 return h};

async function hkScan(f,fn,pg){const R=f.stream().getReader(),D=new TextDecoder();let buf='',n=0;
 for(;;){const{value,done}=await R.read();if(done)break;n+=value.length;buf=fn(buf+D.decode(value,{stream:true}));pg(n/f.size)}
 fn(buf)}
async function hkImport(e){const f=e.target.files[0];if(!f)return;const st=$('hks');
 if(/\.zip$/i.test(f.name)){st.textContent='Bu bir zip dosyası. Dosyalar’da dokunup aç, içindeki export.xml’i seç.';return}
 try{const mo=+$('hkr').value,cut=mo?fmt(new Date(Date.now()-mo*30.5*864e5)):'',W=[];let lp=-1;
  const prog=(p,t)=>{const v=Math.round(p*100);if(v!==lp){lp=v;st.textContent=t+' %'+v}};
  await hkScan(f,b=>{const re=/<Workout [^>]*?(?:\/>|>[\s\S]*?<\/Workout>)/g;let last=0,m;while((m=re.exec(b))){W.push(m[0]);last=re.lastIndex}
   const r=b.slice(last),k=r.lastIndexOf('<Workout ');return k>=0?r.slice(k):r.slice(-12)},p=>prog(p,'Antrenmanlar aranıyor…'));
  const L=W.map(x=>{const tg=x.match(/^<Workout [^>]*>/)[0],sd=at(tg,'startDate'),ed=at(tg,'endDate'),hs=x.match(/<WorkoutStatistics type="HKQuantityTypeIdentifierHeartRate"[^>]*>/);
   let du=parseFloat(at(tg,'duration'))||0;const u=at(tg,'durationUnit');if(u==='sec'||u==='s')du/=60;else if(u==='hr'||u==='h')du*=60;
   return{ty:at(tg,'workoutActivityType').replace('HKWorkoutActivityType',''),sd,du,di:parseFloat(at(tg,'totalDistance'))||0,dnu:at(tg,'totalDistanceUnit'),t0:tm(sd),t1:tm(ed),hr:hs?+at(hs[0],'average')||0:0,hx:hs?+at(hs[0],'maximum')||0:0}}).filter(w=>w.sd.slice(0,10)>=cut);
  const need=L.filter(w=>HK[w.ty]&&!w.hr&&w.t0&&w.t1).sort((a,b)=>a.t0-b.t0);
  if(need.length){need.forEach(w=>{w.s=0;w.n=0;w.m=0});const t0=need[0].t0;
   await hkScan(f,b=>{const re=/<Record type="HKQuantityTypeIdentifierHeartRate"[^>]*>/g;let last=0,m;
    while((m=re.exec(b))){last=re.lastIndex;const ts=tm(at(m[0],'startDate'));if(ts<t0)continue;const v=+at(m[0],'value');let lo=0,hi=need.length-1,ix=-1;
     while(lo<=hi){const md=(lo+hi)>>1;if(need[md].t0<=ts){ix=md;lo=md+1}else hi=md-1}
     for(let j=ix;j>=0&&j>ix-3;j--){const w=need[j];if(ts<=w.t1){w.s+=v;w.n++;if(v>w.m)w.m=v;break}}}
    const r=b.slice(last),k=r.lastIndexOf('<Record ');return k>=0?r.slice(k):r.slice(-12)},p=>prog(p,'Nabız verisi eşleştiriliyor…'));
   need.forEach(w=>{if(w.n){w.hr=Math.round(w.s/w.n);w.hx=Math.round(w.m)}})}
  const have=new Set(S.sessions.map(s=>s.ext).filter(Boolean)),skip={};let add=0,dup=0,id=Date.now();
  L.forEach(w=>{const t=HK[w.ty];if(!t){skip[w.ty]=(skip[w.ty]||0)+1;return}if(w.du<5)return;const ext='hk|'+w.sd+'|'+w.ty;if(have.has(ext)){dup++;return}
   const s={id:id++,date:w.sd.slice(0,10),type:t,dur:Math.round(w.du),rpe:w.hr?Math.min(20,Math.max(6,Math.round(w.hr/10))):13,rpeEst:1,ext};
   if(w.hr){s.hr=Math.round(w.hr);if(w.hx)s.hrx=Math.round(w.hx)}
   const km=w.dnu==='mi'?w.di*1.60934:w.dnu==='m'?w.di/1000:w.dnu==='yd'?w.di*.0009144:w.di;
   if(km>0){if(t==='swim')s.dist=Math.round(km*1000);else if(t==='run'||t==='ell')s.dist=Math.round(km*100)/100}
   S.sessions.push(s);add++});
  const sk=Object.entries(skip).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>k+' '+v).join(', ');
  const msg=`${add} antrenman eklendi${dup?', '+dup+' tanesi zaten vardı':''}.${sk?' Desteklenmeyen türler atlandı: '+sk+'.':''} Nabız yoksa Borg 13 varsayıldı.`;
  if(add)save();render();const el=$('hks');if(el){el.textContent=msg;(el.parentElement||{}).open=true}}
 catch(err){st.textContent='Dosya okunamadı. Sağlık’tan dışa aktardığın export.xml dosyasını seçtiğinden emin ol.'}}

/* Mi Fitness ekran görüntüsü (OCR) */
function parseMi(t){const o={type:'',date:'',dur:'',hr:'',hrx:'',dist:''},ln=t.split('\n').map(x=>x.trim()).filter(Boolean),h=fold(ln[0]||'');
 if(/^(g[uü]|kuvvet|strength)/.test(h))o.type='fitness';else if(/^(ko[sş]|run)/.test(h))o.type='run';else if(/^(y[uü]z|swim)/.test(h))o.type='swim';else if(/^(tenis|tennis)/.test(h))o.type='tennis';else if(/^elip/.test(h))o.type='ell';
 let m=t.match(/(\d{2})\.(\d{2})\.(20\d{2})/);if(m)o.date=m[3]+'-'+m[2]+'-'+m[1];
 const ds=[...t.matchAll(/\b(\d{1,2}):(\d{2}):(\d{2})\b/g)].map(x=>+x[1]*60+ +x[2]+ +x[3]/60);if(ds.length)o.dur=Math.round(Math.max(...ds));
 const di=ln.findIndex(x=>/\d{1,2}:\d{2}:\d{2}/.test(x));
 if(di>=0){const n=(ln[di].replace(/^.*?\d{1,2}:\d{2}:\d{2}/,'').match(/\d+/g)||[]).map(Number),v=n[n.length-1];if(n.length>1&&v>=40&&v<=220)o.hr=v}
 const ni=ln.findIndex(x=>/nabiz\s*\(/.test(fold(x)));
 if(ni>=0){const n=(ln[ni+1]||'').match(/\d{2,3}/g);if(n&&n.length>1&&+n[1]>=+n[0]&&+n[1]<=230)o.hrx=+n[1]}
 m=t.match(/(\d+(?:[.,]\d+)?)\s*km/i);if(m)o.dist=parseFloat(m[1].replace(',','.'));
 return o}
let tessL=null;
async function ocrImage(f,pg){if(!tessL){await new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)});tessL=Tesseract}
 return (await tessL.recognize(f,'tur+eng',{logger:m=>{if(m.status==='recognizing text')pg(m.progress)}})).data.text}
async function miImport(e){const f=e.target.files[0];if(!f)return;const st=$('mis');st.textContent='Görsel okunuyor… (ilk seferde dil dosyası indirilir)';
 try{const o=parseMi(await ocrImage(f,p=>st.textContent='Görsel okunuyor… %'+Math.round(p*100)));
  if(o.type&&o.type!==cur){cur=o.type;kayit()}
  if(o.date)$('fd').value=o.date;if(o.dur)$('fdur').value=o.dur;if($('fhr')&&o.hr)$('fhr').value=o.hr;if($('fhrx')&&o.hrx)$('fhrx').value=o.hrx;if($('fdist')&&o.dist)$('fdist').value=o.dist;
  $('fdur').dispatchEvent(new Event('input'));
  const k=[o.type?T[o.type][0]:'',o.date,o.dur?o.dur+' dk':'',o.hr?'ort. ♥ '+o.hr:'',o.hrx?'maks. ♥ '+o.hrx:''].filter(Boolean);
  $('mis').textContent=k.length?'Okunan: '+k.join(' · ')+'. Kontrol edip kaydet'+(o.type?'':' (spor türünü kendin seç)')+'.':'Görselden değer okunamadı. Değerleri elle gir.'}
 catch(err){const el=$('mis');if(el)el.textContent='Görsel okunamadı (internet gerekir). Değerleri elle gir.'}}
function greet(){const e=$('gr');if(!e)return;const h=new Date().getHours(),g=h<5?'İyi geceler':h<11?'Günaydın':h<18?'Merhaba':h<23?'İyi akşamlar':'İyi geceler';
 e.innerHTML=S.name?`${g}, ${esc(S.name)} 👋<small>${S.sessions.length?'Bugün neyi geliştiriyoruz?':'İlk antrenmanını kaydetmeye hazır mısın?'}</small>`:''}
function welcome(){if(S.name)return;const w=$('wl'),inp=$('wn');w.classList.remove('hide');
 const go=()=>{const n=inp.value.trim();if(!n){inp.focus();return}S.name=n;save();
  $('wc').innerHTML=`<div style="font-size:54px">🎉</div><h2>Memnun oldum, ${esc(n)}!</h2><p class="note" style="margin:0">Workouts hazır. Hadi ilk antrenmanını kaydedelim.</p>`;
  setTimeout(()=>{w.classList.add('hide');render()},1700)};
 $('wb').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>inp.focus(),100)}
function render(){nav();greet();({ozet,kayit,plan,gelisim,vucut})[tab]()}
render();initSync();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
